name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure optional persistent release key
        env:
          INY_KEYSTORE_BASE64: ${{ secrets.INY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$INY_KEYSTORE_BASE64" ]; then
            printf '%s' "$INY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iny-release.jks"
            echo "INY_KEYSTORE=$RUNNER_TEMP/iny-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Validate version and release prerequisites
        run: |
          python3 tools/check-version.py
      - name: Build and lint
        env:
          INY_STORE_PASSWORD: ${{ secrets.INY_STORE_PASSWORD }}
          INY_KEY_ALIAS: ${{ secrets.INY_KEY_ALIAS }}
          INY_KEY_PASSWORD: ${{ secrets.INY_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease lintDebug
      - name: Verify APK signatures
        run: |
          SDK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SDK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee debug-signatures.txt
          "$SDK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee release-signatures.txt
      - uses: actions/upload-artifact@v4
        with:
          name: INY-${{ github.run_number }}-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-debug.html
            *-signatures.txt
      - name: Publish signed release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 tools/check-version.py | sed -E 's/INY ([0-9.]+) .*/\1/')
          TAG="v${VERSION}"
          ASSET="INY-${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "${ASSET}.sha256" --target "$GITHUB_SHA" --title "INY $VERSION" --notes 'Signed Android APK.'
          fi

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>I'm not youtube</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><button class="icon desktop" data-action="sidebar" aria-label="Menu"><span data-icon="menu"></span></button><button class="brand" data-action="home"><img src="/logo.png" alt="Logo I'm not youtube"><span>I'm not youtube</span></button><form id="searchForm"><input id="search" type="search" placeholder="Tìm video hoặc kênh" autocomplete="off" maxlength="200" aria-label="Tìm video hoặc kênh"><button class="icon" type="submit" aria-label="Tìm"><span data-icon="search"></span></button></form><div id="suggestions" hidden aria-label="Gợi ý tìm kiếm"></div><button class="icon mobile" data-action="searchFocus" aria-label="Mở tìm kiếm"><span data-icon="search"></span></button><button class="icon" data-action="uploadForm" aria-label="Tạo nội dung"><span data-icon="plus"></span></button><button class="avatar" data-action="account" aria-label="Tài khoản">I</button></header>
<aside id="sidebar"><button data-action="home"><span data-icon="home"></span>Trang chủ</button><button data-action="short"><span data-icon="short"></span>Shorts</button><button data-action="subscriptions"><span data-icon="subscriptions"></span>Kênh đăng ký</button><hr><button data-action="library"><span data-icon="library"></span>Thư viện của bạn</button><button data-action="history"><span data-icon="history"></span>Đã xem trên INY</button><button data-action="saved"><span data-icon="bookmark"></span>Xem sau trên INY</button><button data-action="playlists"><span data-icon="list"></span>Playlist YouTube</button><button data-action="liked"><span data-icon="like"></span>Video đã thích</button><hr><button data-action="downloadForm"><span data-icon="download"></span>Tải tệp có quyền</button><button data-action="settings"><span data-icon="settings"></span>Cài đặt</button><div class="side-note">Ứng dụng độc lập, không do YouTube hoặc Google phát hành.<br><button data-action="privacy">Quyền riêng tư & điều khoản</button><small>10.00.03 · INY</small></div></aside>
<main id="main"><nav id="chips" aria-label="Bộ lọc video"></nav><section id="content" aria-live="polite"></section></main>
<nav class="bottom" aria-label="Điều hướng chính"><button data-action="home"><span data-icon="home"></span><small>Trang chủ</small></button><button data-action="short"><span data-icon="short"></span><small>Shorts</small></button><button class="create" data-action="uploadForm" aria-label="Tạo"><span data-icon="plus"></span></button><button data-action="subscriptions"><span data-icon="subscriptions"></span><small>Đăng ký</small></button><button data-action="library"><span data-icon="library"></span><small>Bạn</small></button></nav>
<section id="watch" hidden aria-label="Chi tiết video"><div class="watch-top"><button class="icon" data-action="closeWatch" aria-label="Đóng video"><span data-icon="back"></span></button><b id="watchLabel">Đang phát</b></div><div id="playerBox"></div><div class="watch-body" id="watchBody"></div></section>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="icon" data-action="closeDialog" aria-label="Đóng"><span data-icon="close"></span></button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div>
<script src="/app.js"></script></body></html>

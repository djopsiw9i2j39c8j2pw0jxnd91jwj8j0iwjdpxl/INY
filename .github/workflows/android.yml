name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure optional persistent release key
        env:
          INY_KEYSTORE_BASE64: ${{ secrets.INY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$INY_KEYSTORE_BASE64" ]; then
            printf '%s' "$INY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iny-release.jks"
            echo "INY_KEYSTORE=$RUNNER_TEMP/iny-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Validate version and release prerequisites
        run: |
          python3 tools/check-version.py
      - name: Build and lint
        env:
          INY_STORE_PASSWORD: ${{ secrets.INY_STORE_PASSWORD }}
          INY_KEY_ALIAS: ${{ secrets.INY_KEY_ALIAS }}
          INY_KEY_PASSWORD: ${{ secrets.INY_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          SDK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SDK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish single signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 tools/check-version.py | sed -E 's/INY ([0-9.]+) .*/\1/')
          TAG="v${VERSION}"
          ASSET="INY-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "INY $VERSION" --notes 'Signed Android APK.'
          fi
